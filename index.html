<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="株トレ練習">
<title>株トレード練習ツール（PC・スマホ共通版）</title>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<style>
/* ===== PC用 ===== */
body.pc { font-family: "Meiryo", sans-serif; margin: 0; background: #fff; display: flex; height: 100vh; overflow: hidden; }
body.pc #main-container { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
body.pc #chart { flex-grow: 1; width: 100%; }
body.pc #hline-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: none;
  cursor: crosshair;
}
body.pc.hline-mode #hline-overlay { display: block; }
body.pc.hline-mode #chart,
body.pc.hline-mode #chart * { cursor: crosshair !important; }
body.pc .hline-mode-active { outline: 2px solid #e91e8c !important; outline-offset: 1px; }
body.pc #hline-overlay.hover-line { cursor: ns-resize !important; }
body.pc #hline-guide {
  position: absolute; left: 0; right: 0;
  height: 0; border-top: 1px dashed #e91e8c;
  pointer-events: none; display: none; z-index: 11;
}
body.pc #hline-guide-label {
  position: absolute; right: 2px;
  background: #e91e8c; color: #fff;
  font-size: 10px; padding: 1px 4px; border-radius: 2px;
  pointer-events: none; display: none; z-index: 12;
  transform: translateY(-50%); white-space: nowrap;
}
body.pc #side-panel { width: 270px; background: #f4f4f4; border-left: 2px solid #ccc; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
body.pc .section { background: white; border: 1px solid #ccc; padding: 4px 6px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
body.pc .section-title { font-weight: bold; font-size: 0.85em; border-bottom: 1px solid #333; margin-bottom: 2px; }
body.pc .btn-row { display: flex; gap: 3px; margin-bottom: 3px; }
body.pc button { flex: 1; cursor: pointer; padding: 5px 2px; font-weight: bold; border: 1px solid #999; border-radius: 3px; background: #fff; font-size: 0.8em; }
body.pc button:active { background: #ddd; }
body.pc .active-mode { background: #4caf50 !important; color: white !important; border: none !important; }
body.pc .btn-buy { background: #ff5252; color: white; border: none; }
body.pc .btn-sell { background: #2196f3; color: white; border: none; }
body.pc .btn-close-buy { background: #fff; color: #ff5252; border: 1px solid #ff5252; }
body.pc .btn-close-sell { background: #fff; color: #2196f3; border: 1px solid #2196f3; }
body.pc .btn-nav { background: #4caf50; color: white; border: none; }
body.pc .btn-reset { background: #757575; color: white; border: none; font-size: 0.7em; }
body.pc .btn-save { background: #f57c00; color: white; border: none; }
body.pc .stat-val { font-size: 1.1em; font-weight: bold; text-align: center; margin: 0; color: red; }
body.pc .pos-table { width: 100%; border-collapse: collapse; font-size: 0.75em; }
body.pc .pos-table th,
body.pc .pos-table td { border: 1px solid #ccc; padding: 2px; text-align: center; }
body.pc #log-area { height: 80px; background: #eee; border: 1px solid #ccc; padding: 4px; font-size: 0.7em; overflow-y: auto; border-radius: 3px; }
body.pc .input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
body.pc input[type="text"],
body.pc input[type="number"],
body.pc select { padding: 4px; border: 1px solid #ccc; border-radius: 3px; font-size: 0.85em; width: 100%; box-sizing: border-box; }
body.pc #ma-short-val { font-size: 1.1em !important; font-weight: normal; text-align: left; height: auto; padding: 1px 2px !important; }

/* ===== スマホ用 ===== */
body.mobile {
  font-family: "Meiryo", sans-serif;
  margin: 0;
  background: #fff;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  position: fixed;
}
body.mobile #main-container { flex: 5.5; min-height: 0; position: relative; }
body.mobile #chart { height: 100%; width: 100%; }
body.mobile #hline-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: none;
  cursor: crosshair;
  touch-action: none; 
}
body.mobile.hline-mode #hline-overlay { display: block; }
body.mobile.hline-mode #chart,
body.mobile.hline-mode #chart * { cursor: crosshair !important; }
body.mobile .hline-mode-active { outline: 2px solid #e91e8c !important; outline-offset: 1px; }
body.mobile #hline-overlay.hover-line { cursor: ns-resize !important; }
body.mobile #hline-guide {
  position: absolute; left: 0; right: 0;
  height: 0; border-top: 1px dashed #e91e8c;
  pointer-events: none; display: none; z-index: 11;
}
body.mobile #hline-guide-label {
  position: absolute; right: 2px;
  background: #e91e8c; color: #fff;
  font-size: 10px; padding: 1px 4px; border-radius: 2px;
  pointer-events: none; display: none; z-index: 12;
  transform: translateY(-50%); white-space: nowrap;
}
body.mobile #side-panel {
  flex: 4.5;
  background: #f4f4f4;
  border-top: 2px solid #ccc;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body.mobile #panels-row {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}
body.mobile #ma-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: #fff;
  border-bottom: 1px solid #ccc;
  padding: 3px 6px;
  font-size: 0.8em;
}
body.mobile #ma-bar button { padding: 3px 0 !important; }
body.mobile #ma-bar input { padding: 3px 2px !important; }
body.mobile #tf-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: #fff; border-bottom: 1px solid #ccc; }
body.mobile #tf-bar #btn-daily,
body.mobile #tf-bar #btn-weekly,
body.mobile #tf-bar #btn-monthly { flex: 1 1 0; min-height: 0; height: 30px; font-size: 0.85em; padding: 2px 0 !important; line-height: 1; }
body.mobile #panels-row { padding-top: 10px; }
body.mobile #right-panel button { min-height: 42px !important; }
body.mobile #left-panel { display: flex; flex-direction: column; overflow: hidden; gap: 0; }
body.mobile .lp-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
body.mobile .lp-foot { flex: 0 0 auto; padding-top: 6px; border-top: 1px solid #bbb; }
body.mobile #right-panel { display: flex; flex-direction: column; overflow: hidden; gap: 0; }
body.mobile .rp-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 9px; padding-right: 2px; }
body.mobile .rp-foot { flex: 0 0 auto; padding-top: 9px; border-top: 1px solid #bbb; }
body.mobile #right-panel .btn-row { margin-bottom: 8px !important; }
body.mobile #right-panel .section { padding: 7px 6px !important; }
body.mobile .panel-half {
  flex: 1;
  padding: 4px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
body.mobile #left-panel { border-right: 1px solid #ccc; }
body.mobile .section { background: white; border: 1px solid #ccc; padding: 3px 6px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); flex-shrink: 0; }
body.mobile .section-title { font-weight: bold; font-size: 0.75em; border-bottom: 1px solid #333; margin-bottom: 2px; color: #333; }
body.mobile .btn-row { display: flex; gap: 3px; margin-bottom: 3px; }
body.mobile button {
  flex: 1;
  cursor: pointer;
  padding: 9px 2px;
  font-weight: bold;
  border: 1px solid #999;
  border-radius: 5px;
  background: #fff;
  font-size: 0.75em;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-user-select: none;
}
body.mobile button:active { background: #ddd; }
body.mobile .active-mode { background: #4caf50 !important; color: white !important; border: none !important; }
body.mobile .btn-buy { background: #ff5252; color: white; border: none; }
body.mobile .btn-sell { background: #2196f3; color: white; border: none; }
body.mobile .btn-close-buy { background: #fff; color: #ff5252; border: 1px solid #ff5252; }
body.mobile .btn-close-sell { background: #fff; color: #2196f3; border: 1px solid #2196f3; }
body.mobile .btn-nav { background: #4caf50; color: white; border: none; }
body.mobile .btn-reset { background: #757575; color: white; border: none; font-size: 0.7em; padding: 5px; width: 100%; margin-top: 4px; }
body.mobile .btn-save { background: #f57c00; color: white; border: none; }
body.mobile .stat-val { font-size: 1em; font-weight: bold; text-align: center; color: red; margin: 2px 0; }
body.mobile .pos-table { width: 100%; border-collapse: collapse; font-size: 0.7em; }
body.mobile .pos-table th,
body.mobile .pos-table td { border: 1px solid #ccc; padding: 3px 1px; text-align: center; }
body.mobile #log-area { min-height: 60px; background: #eee; border: 1px solid #ccc; padding: 4px; font-size: 0.7em; overflow-y: auto; flex-shrink: 0; }
body.mobile input[type="text"],
body.mobile input[type="number"],
body.mobile select { padding: 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 0.85em; width: 100%; box-sizing: border-box; }
body.mobile #unrealized-profit { font-size: 0.78em; font-weight: bold; white-space: nowrap; }
body.mobile #last-profit { font-size: 0.7em; height: 1.2em; white-space: nowrap; overflow: hidden; }
body.mobile #view-range-val {
  font-size: 1.2em !important;
  font-weight: normal;
  text-align: left;
  height: auto;
  padding: 5px 5px !important;
}
</style>
</head>
<body>

<div id="main-container">
  <div id="chart"></div>
  <!-- ★ 水平線クリック受付用オーバーレイ -->
  <div id="hline-overlay"></div>
  <!-- ★ 水平線ガイド -->
  <div id="hline-guide"></div>
  <div id="hline-guide-label"></div>
</div>

<!-- ===== PC用の操作パネル ===== -->
<template id="tpl-pc">
<div id="side-panel">
  <!-- 銘柄選択 -->
  <div class="section">
    <div class="input-group">
      <select id="ticker-select" onchange="document.getElementById('ticker-input').value=this.value; fetchData();"></select>
      <div style="display:flex; gap:2px;">
        <input type="text" id="ticker-input" placeholder="コード" style="width: 70px;" value="7203">
        <button class="btn-nav" onclick="fetchData()">WEB銘柄読込</button>
      </div>
    </div>
    <div id="status-display" style="font-size: 0.7em; color: #666;">銘柄を選択または入力</div>
  </div>

  <!-- ① MA設定（タイトル削除・インライン化） -->
  <div class="section">
    <div style="font-size: 0.78em; display: flex; align-items: center; justify-content: space-between; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 2px;">
        <span style="font-weight: bold; white-space: nowrap;">短期</span>
        <button onclick="adjustMA(-1)" style="flex:none; width: 20px; padding: 2px; background: #eee;">－</button>
        <input type="number" id="ma-short-val" value="4"
               style="width: 38px; text-align: center; border: 1px solid #ccc; font-size: 1.05em; padding: 1px;"
               onchange="saveMAPrefs(); updateAllMA()">
        <button onclick="adjustMA(1)" style="flex:none; width: 20px; padding: 2px; background: #eee;">＋</button>
      </div>
      <div style="display: flex; align-items: center; gap: 2px;">
        <span style="font-weight: bold; white-space: nowrap;">中期</span>
        <button onclick="adjustMidMA(-1)" style="flex:none; width: 20px; padding: 2px; background: #eee;">－</button>
        <input type="number" id="ma-mid-val" value="8"
               style="width: 38px; text-align: center; border: 1px solid #ccc; font-size: 1.05em; padding: 1px;"
               onchange="saveMAPrefs(); updateAllMA()">
        <button onclick="adjustMidMA(1)" style="flex:none; width: 20px; padding: 2px; background: #eee;">＋</button>
      </div>
    </div>
  </div>

  <!-- ③ 時間軸切替 + 表示範囲を統合 -->
  <div class="section">
    <div class="btn-row" style="margin-bottom:4px;">
      <button id="btn-daily" class="active-mode" onclick="changeTimeframe('daily')">日足</button>
      <button id="btn-weekly" onclick="changeTimeframe('weekly')">週足</button>
      <button id="btn-monthly" onclick="changeTimeframe('monthly')">月足</button>
    </div>
    <div style="font-size:0.8em; display:flex; align-items:center; gap:6px;">
      <span style="font-weight:bold; white-space:nowrap;">表示数:</span>
      <button onclick="adjustViewRange(-10)" style="flex:none; width:32px; padding:2px; background:#eee;">－10</button>
      <input type="number" id="view-range-val" value="80"
             style="flex-grow:1; min-width:0; width:auto; text-align:center; border:1px solid #ccc; font-size:1em; box-sizing:border-box;"
             onchange="updateViewRange()">
      <button onclick="adjustViewRange(10)" style="flex:none; width:32px; padding:2px; background:#eee;">＋10</button>
    </div>
  </div>

  <!-- ★ 水平線セクション（コンパクト1行） -->
  <div class="section">
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-weight:bold; font-size:0.8em; white-space:nowrap;">水平線:</span>
      <button id="btn-hline-on" onclick="setHlineMode(true)"
              style="flex:none; padding:2px 6px; font-size:0.75em; background:#e91e8c; color:white; border:none; border-radius:3px;">ON</button>
      <button id="btn-hline-off" onclick="setHlineMode(false)"
              style="flex:none; padding:2px 6px; font-size:0.75em; background:#757575; color:white; border:none; border-radius:3px;">全消去</button>
      <span id="hline-status" style="font-size:0.72em; color:#888; white-space:nowrap;">OFF</span>
    </div>
  </div>

  <!-- エントリー日数表示 -->
  <div class="section">
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-weight:bold; font-size:0.8em; white-space:nowrap;">エントリー:</span>
      <span id="entry-day-count" style="font-weight:bold; font-size:0.8em; color:#999; flex-grow:1;">- 日目</span>
      <button id="btn-entry-back" class="btn-nav" onclick="goToEntryDay()"
              style="flex:none; padding:2px 6px; font-size:0.75em; border-radius:3px;">初日に戻る</button>
    </div>
  </div>

  <!-- ⑤ 損益（2行コンパクト版・大きな数値対応） -->
  <div class="section">
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-size:0.7em; color:#666; font-weight:bold; white-space:nowrap;">累計</span>
      <div id="total-profit" class="stat-val"
           style="font-size:1.05em; text-align:left; flex:1 1 0; min-width:0; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">0 円</div>
      <button class="btn-reset" style="flex:none; padding:3px 8px; font-size:0.7em;" onclick="resetProfit()">リセット</button>
    </div>
    <div style="display:flex; align-items:center; gap:8px; margin-top:2px;">
      <div id="unrealized-profit" style="font-size:0.78em; font-weight:bold; white-space:nowrap;">含み: 0 円</div>
      <div id="last-profit" style="font-size:0.7em; font-weight:bold; flex-grow:1; text-align:right; height:12px; white-space:nowrap; overflow:hidden;"></div>
    </div>
  </div>


  <!-- ポジション (玉操作) -->
  <div class="section">
    <div class="section-title">ポジション (玉操作)</div>
    <table class="pos-table">
      <tr><th style="color:blue">売玉</th><th>単価</th><th style="color:red">買玉</th><th>単価</th></tr>
      <tr><td id="short-qty">0</td><td id="short-avg">-</td><td id="long-qty">0</td><td id="long-avg">-</td></tr>
    </table>
    <div style="margin-top:6px;">
      <div class="btn-row">
        <button class="btn-sell" onclick="addPosition('short')">売(100)追加</button>
        <button class="btn-buy" onclick="addPosition('long')">買(100)追加</button>
      </div>
      <div class="btn-row">
        <button class="btn-close-sell" onclick="closeOne('short')">売(100)決済</button>
        <button class="btn-close-buy" onclick="closeOne('long')">買(100)決済</button>
      </div>
    </div>
    <button style="width:100%; height:24px; margin-top:3px; font-size:0.75em;" onclick="closeAll()">全ポジション一括決済</button>
  </div>

  <!-- ① 操作（タイトル削除）＋ ② 1ヶ月/3ヶ月/1年を3列グリッド化 -->
  <div class="section">
    <div class="btn-row">
      <button onclick="moveDay(-1)">←戻る</button>
      <button class="btn-nav" onclick="moveDay(1)">翌日→</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:3px; margin-bottom:3px;">
      <button onclick="moveJump(-20)">1ヶ月戻</button>
      <button onclick="moveJump(-60)">3ヶ月戻</button>
      <button onclick="moveJump(-240)">1年戻</button>
      <button onclick="moveJump(20)">1ヶ月進</button>
      <button onclick="moveJump(60)">3ヶ月進</button>
      <button onclick="moveJump(240)">1年進</button>
    </div>
    <div class="btn-row" style="margin-bottom:0;">
      <button style="background:#eee" onclick="moveJump(-999999)">最古へ</button>
      <button style="background:#eee" onclick="moveJump(999999)">最新へ</button>
    </div>
  </div>

  <!-- クイックセーブ -->
  <div class="section" style="border: 2px solid #4caf50;">
    <div class="section-title" style="color:#2e7d32;">クイックセーブ</div>
    <div class="btn-row">
      <button class="btn-nav" onclick="quickSave(false, this)">新規保存</button>
      <button class="btn-save" onclick="quickSave(true, this)">上書き保存</button>
    </div>
    <select id="save-list" style="width:100%; font-size:0.75em; margin:4px 0; padding:2px;"></select>
    <div class="btn-row" style="margin-bottom:0;">
      <button class="btn-nav" style="background:#2196f3" onclick="quickLoad()">読込</button>
      <button class="btn-reset" onclick="deleteSave()">削除</button>
    </div>
    <div class="btn-row" style="margin-bottom:0; margin-top:3px;">
      <button class="btn-reset" style="background:#b71c1c;"
              onclick="if(confirm('全セーブデータを削除しますか？')){
                Object.keys(localStorage).filter(k=>k.startsWith('tradeToolSave_')).forEach(k=>localStorage.removeItem(k));
                updateSaveList();
              }">全削除</button>
    </div>
  </div>

  <!-- ① 履歴（タイトル削除） -->
  <div class="section">
    <div id="log-area"></div>
  </div>
</div>
</template>

<!-- ===== スマホ用の操作パネル ===== -->
<template id="tpl-mobile">
<div id="side-panel">

  <!-- 短期MA・中期MA（全幅1段バー） -->
  <div id="ma-bar">
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-weight:bold; white-space:nowrap;">短期</span>
      <button onclick="adjustMA(-1)" style="flex:0 0 30px; width:30px; padding:6px 0; box-sizing:border-box; background:#eee;">－</button>
      <input type="number" id="ma-short-val" value="4" style="width:46px; box-sizing:border-box; text-align:center; border:1px solid #ccc; font-size:1em; padding:5px 2px;" onchange="saveMAPrefs(); updateAllMA()">
      <button onclick="adjustMA(1)" style="flex:0 0 30px; width:30px; padding:6px 0; box-sizing:border-box; background:#eee;">＋</button>
    </div>
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-weight:bold; white-space:nowrap;">中期</span>
      <button onclick="adjustMidMA(-1)" style="flex:0 0 30px; width:30px; padding:6px 0; box-sizing:border-box; background:#eee;">－</button>
      <input type="number" id="ma-mid-val" value="8" style="width:46px; box-sizing:border-box; text-align:center; border:1px solid #ccc; font-size:1em; padding:5px 2px;" onchange="saveMAPrefs(); updateAllMA()">
      <button onclick="adjustMidMA(1)" style="flex:0 0 30px; width:30px; padding:6px 0; box-sizing:border-box; background:#eee;">＋</button>
    </div>
  </div>

  <!-- 足種切替 + 水平線（全幅固定バー・1段） -->
  <div id="tf-bar">
    <button id="btn-daily" class="active-mode" onclick="changeTimeframe('daily')">日足</button>
    <button id="btn-weekly" onclick="changeTimeframe('weekly')">週足</button>
    <button id="btn-monthly" onclick="changeTimeframe('monthly')">月足</button>
    <span style="font-weight:bold; font-size:0.72em; white-space:nowrap; margin-left:4px;">水平線</span>
    <button id="btn-hline-on" onclick="setHlineMode(true)" style="flex:0 0 auto; min-height:32px; padding:4px 8px; font-size:0.75em; background:#e91e8c; color:white; border:none; border-radius:3px;">ON</button>
    <button id="btn-hline-off" onclick="setHlineMode(false)" style="flex:0 0 auto; min-height:32px; padding:4px 6px; font-size:0.75em; background:#757575; color:white; border:none; border-radius:3px;">消去</button>
    <span id="hline-status" style="font-size:0.7em; color:#888; white-space:nowrap;">OFF</span>
  </div>

  <div id="panels-row">
  <!-- ========== 左パネル ========== -->
  <div class="panel-half" id="left-panel">

    <div class="lp-scroll">

    <!-- 1. 銘柄読込 -->
    <div class="section">

<script>
let dailyData = [];
let weeklyData = [];
let monthlyData = [];
let timeframe = 'daily';
let currentDailyIndex = 0;
let totalProfit = 0;
let positions = { long: [], short: [] };
let tradeHistory = [];
let FIXED_VIEW_RANGE = DEVICE.viewRange;

// ★ MAの初期値（記憶した値がないときに使う）
const DEFAULT_MA_SHORT = 4;
const DEFAULT_MA_MID = 8;

// ★ 水平線管理
let hlines = [];
let hlineMode = false;
const HLINE_COLOR = '#4caf50';
let hlineDragIdx = null;
let hlineDidDrag = false;
let hlineDownOnLine = false;
const HLINE_HIT_PX = DEVICE.hitPx;

/** 水平線モード切替 */
function setHlineMode(on) {
  if (on) {
    hlineMode = true;
    document.body.classList.add('hline-mode');
    document.getElementById('btn-hline-on').classList.add('hline-mode-active');
    document.getElementById('hline-status').textContent = 'ON';
    document.getElementById('hline-status').style.color = '#e91e8c';
  } else {
    hlineMode = false;
    hlines = [];
    document.body.classList.remove('hline-mode');
    document.getElementById('btn-hline-on').classList.remove('hline-mode-active');
    document.getElementById('hline-status').textContent = 'OFF';
    document.getElementById('hline-status').style.color = '#888';
    hideHlineGuide();
    drawChart();
  }
}

/** Y軸座標変換ユーティリティ */
function getYAxisInfo() {
  const chartDiv = document.getElementById('chart');
  const fl = chartDiv._fullLayout;
  if (!fl) return null;
  const ya = fl.yaxis;
  const r = ya._rl || ya.range;
  return {
    ya,
    plotTopClient: chartDiv.getBoundingClientRect().top + ya._offset,
    plotLen: ya._length,
    yTop: Math.max(r[0], r[1]),
    yBottom: Math.min(r[0], r[1])
  };
}
function pixelToDataY(clientY) {
  const info = getYAxisInfo();
  if (!info) return null;
  if (clientY < info.plotTopClient || clientY > info.plotTopClient + info.plotLen) return null;
  const ratio = (clientY - info.plotTopClient) / info.plotLen;
  return info.yTop - ratio * (info.yTop - info.yBottom);
}
function dataYToContainerTop(yVal) {
  const info = getYAxisInfo();
  if (!info) return null;
  const containerTop = document.getElementById('main-container').getBoundingClientRect().top;
  const ratio = (info.yTop - yVal) / (info.yTop - info.yBottom);
  return (info.plotTopClient - containerTop) + ratio * info.plotLen;
}
function getChartYFromClick(e) {
  const y = pixelToDataY(e.clientY);
  return y === null ? null : Math.round(y);
}

/** 水平線ヒット判定 */
function findNearestHlineIdx(yVal) {
  const info = getYAxisInfo();
  if (!info || hlines.length === 0) return -1;
  const tol = (info.yTop - info.yBottom) * HLINE_HIT_PX / info.plotLen;
  let bestIdx = -1, bestDist = tol;
  hlines.forEach((h, i) => {
    const d = Math.abs(h.y - yVal);
    if (d <= bestDist) { bestDist = d; bestIdx = i; }
  });
  return bestIdx;
}

/** ガイド表示／非表示 */
function showHlineGuide(yVal, isExisting) {
  const top = dataYToContainerTop(yVal);
  if (top === null) { hideHlineGuide(); return; }
  const g = document.getElementById('hline-guide');
  const lab = document.getElementById('hline-guide-label');
  g.style.display = 'block';
  g.style.top = top + 'px';
  g.style.borderTopStyle = isExisting ? 'solid' : 'dashed';
  g.style.borderTopColor = isExisting ? '#ff9800' : '#e91e8c';
  lab.style.display = 'block';
  lab.style.top = top + 'px';
  lab.textContent = Math.round(yVal).toLocaleString();
  lab.style.background = isExisting ? '#ff9800' : '#e91e8c';
}
function hideHlineGuide() {
  const g = document.getElementById('hline-guide');
  const lab = document.getElementById('hline-guide-label');
  if (g) g.style.display = 'none';
  if (lab) lab.style.display = 'none';
}

/** ドラッグ中の軽量再描画（shapes / annotations のみ更新） */
function relayoutHlineShapesOnly() {
  const shapes = hlines.map(h => ({
    type: 'line', xref: 'paper', yref: 'y',
    x0: 0, x1: 1, y0: h.y, y1: h.y,
    line: { color: HLINE_COLOR, width: 1.5, dash: 'solid' }
  }));
  const chartDiv = document.getElementById('chart');
  const cur = (chartDiv.layout && chartDiv.layout.annotations) || [];
  // hline用の注釈は xref:'paper', x:1.01 で識別
  const tradeAnns = cur.filter(a => !(a.xref === 'paper' && a.x === 1.01));
  const hlineAnns = hlines.map(h => ({
    xref: 'paper', yref: 'y',
    x: 1.01, y: h.y,
    text: h.y.toLocaleString(),
    showarrow: false,
    font: { size: DEVICE.hlineFont, color: HLINE_COLOR },
    xanchor: 'left'
  }));
  Plotly.relayout('chart', { shapes: shapes, annotations: tradeAnns.concat(hlineAnns) });
}

if (!IS_MOBILE) {
// ★ オーバーレイのイベント登録（クリック=新規追加 / ホバー=ガイド / ドラッグ=移動）
const _hlineOverlay = document.getElementById('hline-overlay');

_hlineOverlay.addEventListener('mousemove', function(e) {
  if (!hlineMode) return;
  if (hlineDragIdx !== null) {
    const y = pixelToDataY(e.clientY);
    if (y === null) return;
    hlines[hlineDragIdx].y = Math.round(y);
    hlineDidDrag = true;
    showHlineGuide(hlines[hlineDragIdx].y, true);
    relayoutHlineShapesOnly();
    return;
  }
  const y = pixelToDataY(e.clientY);
  if (y === null) { hideHlineGuide(); _hlineOverlay.classList.remove('hover-line'); return; }
  const idx = findNearestHlineIdx(y);
  if (idx !== -1) {
    _hlineOverlay.classList.add('hover-line');
    showHlineGuide(hlines[idx].y, true);
  } else {
    _hlineOverlay.classList.remove('hover-line');
    showHlineGuide(Math.round(y), false);
  }
});

_hlineOverlay.addEventListener('mouseleave', function() {
  if (hlineDragIdx === null) hideHlineGuide();
});

_hlineOverlay.addEventListener('mousedown', function(e) {
  if (!hlineMode) return;
  if (e.button !== 0) return;
  hlineDidDrag = false;
  hlineDownOnLine = false;
  const y = pixelToDataY(e.clientY);
  if (y === null) return;
  const idx = findNearestHlineIdx(y);
  if (idx !== -1) {
    hlineDragIdx = idx;
    hlineDownOnLine = true;
    e.preventDefault();
  }
});

window.addEventListener('mouseup', function() {
  if (hlineDragIdx !== null) {
    hlineDragIdx = null;
    drawChart();
  }
});

_hlineOverlay.addEventListener('click', function(e) {
  if (!hlineMode) return;
  if (hlineDidDrag || hlineDownOnLine) {
    hlineDidDrag = false;
    hlineDownOnLine = false;
    return;
  }
  const y = getChartYFromClick(e);
  if (y === null) return;
  hlines.push({ y: y });
  drawChart();
});
} else {
// ★ 統一ポインタイベント（マウス＋タッチ両対応）
const overlay = document.getElementById('hline-overlay');

function getEventClientY(e) {
  if (e.touches && e.touches.length > 0) return e.touches[0].clientY;
  if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientY;
  return e.clientY;
}

function onPointerDown(e) {
  if (!hlineMode) return;
  hlineDidDrag = false;
  hlineDownOnLine = false;
  const y = pixelToDataY(getEventClientY(e));
  if (y === null) return;
  const idx = findNearestHlineIdx(y);
  if (idx !== -1) {
    hlineDragIdx = idx;
    hlineDownOnLine = true;
    showHlineGuide(hlines[idx].y, true);
    e.preventDefault();
  } else {
    // 新規候補位置にガイド表示
    showHlineGuide(Math.round(y), false);
  }
}

function onPointerMove(e) {
  if (!hlineMode) return;
  const clientY = getEventClientY(e);

  // ① 既存線ドラッグ中
  if (hlineDragIdx !== null) {
    const y = pixelToDataY(clientY);
    if (y === null) return;
    hlines[hlineDragIdx].y = Math.round(y);
    hlineDidDrag = true;
    showHlineGuide(hlines[hlineDragIdx].y, true);
    relayoutHlineShapesOnly();
    e.preventDefault();
    return;
  }

  // ② タッチで新規ライン位置プレビュー中（指のスライドにガイドを追従）
  if (e.type === 'touchmove') {
    const y = pixelToDataY(clientY);
    if (y === null) { hideHlineGuide(); return; }
    showHlineGuide(Math.round(y), false);
    e.preventDefault();
    return;
  }

  // ③ マウスホバー時のガイド
  if (e.type === 'mousemove') {
    const y = pixelToDataY(clientY);
    if (y === null) { hideHlineGuide(); overlay.classList.remove('hover-line'); return; }
    const idx = findNearestHlineIdx(y);
    if (idx !== -1) {
      overlay.classList.add('hover-line');
      showHlineGuide(hlines[idx].y, true);
    } else {
      overlay.classList.remove('hover-line');
      showHlineGuide(Math.round(y), false);
    }
  }
}

function onPointerUp(e) {
  if (!hlineMode) {
    hlineDragIdx = null;
    return;
  }
  if (hlineDragIdx !== null) {
    hlineDragIdx = null;
    hideHlineGuide();
    drawChart();
    return;
  }
  // ドラッグでなく、線上でもなければ → 新規追加（タップ／クリック扱い）
  if (!hlineDidDrag && !hlineDownOnLine) {
    const y = pixelToDataY(getEventClientY(e));
    if (y !== null) {
      hlines.push({ y: Math.round(y) });
      hideHlineGuide();
      drawChart();
    }
  }
  hlineDidDrag = false;
  hlineDownOnLine = false;
}

// マウス
overlay.addEventListener('mousedown', onPointerDown);
overlay.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
overlay.addEventListener('mouseleave', () => { if (hlineDragIdx === null) hideHlineGuide(); });

// タッチ
overlay.addEventListener('touchstart', onPointerDown, { passive: false });
overlay.addEventListener('touchmove', onPointerMove, { passive: false });
overlay.addEventListener('touchend', function(e) {
  e.preventDefault();
  onPointerUp(e);
}, { passive: false });
overlay.addEventListener('touchcancel', () => { hlineDragIdx = null; hideHlineGuide(); });
}

async function fetchData() {
  var ticker = document.getElementById('ticker-input').value.trim();
  var status = document.getElementById('status-display');
  if (!ticker) return;

  status.innerText = "専用GASプロキシ経由で取得中...";
  try {
    var gasBaseUrl = "https://script.google.com/macros/s/AKfycbxmQEpaLXfF4DXlvrmi4Byr8qFei637lhBSA9sCMDba5n_TJJ-6I4dR9iAGNo8zNjEpfg/exec";
    var gasUrl = gasBaseUrl + "?ticker=" + ticker;

    var response = await fetch(gasUrl);
    var resultJson = await response.json();

    if (!resultJson.chart || !resultJson.chart.result) {
      throw new Error("データ構造が不正です");
    }

    var result = resultJson.chart.result[0];
    const timestamps = result.timestamp;
    const quotes = result.indicators.quote[0];

    dailyData = timestamps.map((ts, i) => {
      const dObj = new Date(ts * 1000);
      const y = String(dObj.getFullYear()).substring(2);
      const m = String(dObj.getMonth() + 1).padStart(2, '0');
      const d = String(dObj.getDate()).padStart(2, '0');
      const o = quotes.open[i]  || quotes.close[i];
      const h = quotes.high[i]  || quotes.close[i];
      const l = quotes.low[i]   || quotes.close[i];
      const c = quotes.close[i];
      return {
        date: `${y}-${m}-${d}`,
        rawDate: dObj,
        open:  Math.round(o),
        high:  Math.round(h),
        low:   Math.round(l),
        close: Math.round(c)
      };
    }).filter(d => d.close && !isNaN(d.close));

    for (let j = dailyData.length - 2; j >= 0; j--) {
    if (dailyData[j+1].close / dailyData[j].close < 0.3) {
     let r = dailyData[j+1].close / dailyData[j].close;
      for (let k = 0; k <= j; k++) {
        ['open','high','low','close'].forEach(p => dailyData[k][p] = Math.round(dailyData[k][p] * r));
      }
     }
    }

    currentDailyIndex = dailyData.length - 1;
    weeklyData  = aggregateData('weekly');
    monthlyData = aggregateData('monthly');

    updateAllMA();
    currentDailyIndex = dailyData.length - 1;
    tradeHistory = [];
    document.getElementById('log-area').innerHTML = "";
    status.innerText = "読込完了(" + dailyData.length + "日分): " + ticker;
    updateDisplay();

  } catch (e) {
    status.innerText = "エラー: 取得失敗";
    console.error(e);
  }
}

function aggregateDataFromList(dataList, tf) {
  let result = [];
  let temp = null;
  dataList.forEach((d, i) => {
    let isNewPeriod = false;
    if (!temp) {
      isNewPeriod = true;
    } else {
      if (tf === 'weekly') {
        let prevDate = dataList[i-1].rawDate;
        if (d.rawDate.getDay() <= prevDate.getDay() || (d.rawDate - prevDate) > 518400000) isNewPeriod = true;
      } else if (tf === 'monthly') {
        if (d.rawDate.getMonth() !== dataList[i-1].rawDate.getMonth()) isNewPeriod = true;
      }
    }
    if (isNewPeriod) {
      if (temp) { temp.date = dataList[i-1].date; result.push(temp); }
      temp = { ...d, originalDates: [d.date] };
    } else {
      temp.high = Math.max(temp.high, d.high);
      temp.low  = Math.min(temp.low,  d.low);
      temp.close = d.close;
      temp.originalDates.push(d.date);
    }
  });
  if (temp) { temp.date = dataList[dataList.length - 1].date; result.push(temp); }
  return result;
}

function aggregateData(tf) {
  let result = [];
  let temp = null;
  dailyData.forEach((d, i) => {
    let isNewPeriod = false;
    if (!temp) isNewPeriod = true;
    else {
      if (tf === 'weekly') {
        let prevDate = dailyData[i-1].rawDate;
        if (d.rawDate.getDay() <= prevDate.getDay() || (d.rawDate - prevDate) > 518400000) isNewPeriod = true;
      } else if (tf === 'monthly') {
        if (d.rawDate.getMonth() !== dailyData[i-1].rawDate.getMonth()) isNewPeriod = true;
      }
    }
    if (isNewPeriod) {
      if (temp) { temp.date = dailyData[i-1].date; result.push(temp); }
      temp = { ...d, originalDates: [d.date] };
    } else {
      temp.high = Math.max(temp.high, d.high);
      temp.low  = Math.min(temp.low,  d.low);
      temp.close = d.close;
      temp.originalDates.push(d.date);
    }
  });
  if (temp) { temp.date = dailyData[dailyData.length - 1].date; result.push(temp); }
  return result;
}

function calculateMA(arr) {
  if (!arr.length) return;
  const shortP = parseInt(document.getElementById('ma-short-val').value) || DEFAULT_MA_SHORT;
  const midEl = document.getElementById('ma-mid-val');
  const midP = midEl ? (parseInt(midEl.value) || DEFAULT_MA_MID) : DEFAULT_MA_MID;
  const periods = { maShort: shortP, ma13: midP, ma20: 20, ma60: 60, ma100: 100, ma300: 300 };
  arr.forEach((d, i) => {
    for (let key in periods) {
      const p = periods[key];
      if (i < p - 1) d[key] = null;
      else {
        let sum = 0;
        for (let j = 0; j < p; j++) sum += arr[i - j].close;
        d[key] = sum / p;
      }
    }
  });
}

function updateAllMA() {
  calculateMA(dailyData);
  drawChart();
}

    if (!(s >= 1) || !(m >= 1)) return;
    localStorage.setItem(MA_PREF_KEY, JSON.stringify({ maShort: s, maMid: m }));
  } catch (e) { console.warn('MA設定の保存に失敗', e); }
}
function loadMAPrefs() {

    if (p.maShort >= 1) document.getElementById('ma-short-val').value = p.maShort;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') moveDay(1);
  if (e.key === 'ArrowLeft')  moveDay(-1);
});

function moveDay(n) {
  if (dailyData.length === 0) return;
  currentDailyIndex = Math.max(0, Math.min(dailyData.length - 1, currentDailyIndex + n));
  updateDisplay();
}
function moveJump(n) { moveDay(n); }
function resetProfit() { totalProfit = 0; tradeHistory = []; updateDisplay(); }

// ★ エントリー日インデックス取得
function getEntryDayIndex() {
  if (!tradeHistory || tradeHistory.length === 0) return -1;
  let endIdx = tradeHistory.length - 1;
  while (endIdx >= 0 && tradeHistory[endIdx].sQty === 0 && tradeHistory[endIdx].lQty === 0) {
    endIdx--;
  }
  if (endIdx < 0) return -1;
  let startIdx = endIdx;
  while (startIdx > 0) {
    const prev = tradeHistory[startIdx - 1];
    if (prev.sQty === 0 && prev.lQty === 0) break;
    startIdx--;
  }
  const entryDate = tradeHistory[startIdx].date;
  return dailyData.findIndex(d => d.date === entryDate);
}

function goToEntryDay() {
  const entryIdx = getEntryDayIndex();
  if (entryIdx < 0) return;
  currentDailyIndex = entryIdx;
  updateDisplay();
}

function addPosition(type) {
  if (dailyData.length === 0) return;
  const price = dailyData[currentDailyIndex].close;
  positions[type].push({ price: price, qty: 100 });
  recordTradeHistory();
  addLog(`${type === 'long' ? '買' : '売'}追加: ${price}円`, type === 'long' ? 'red' : 'blue');
  updateDisplay();
}

function closeOne(type) {
  if (positions[type].length === 0) return;
  const currentPrice = dailyData[currentDailyIndex].close;
  const p = positions[type].shift();
  let profit = (type === 'long') ? (currentPrice - p.price) * p.qty : (p.price - currentPrice) * p.qty;
  totalProfit += profit;
  recordTradeHistory();
  document.getElementById('last-profit').innerText = (IS_MOBILE ? "確定: " + profit.toLocaleString() + "円" : "確定損益: " + profit.toLocaleString() + " 円");
  document.getElementById('last-profit').style.color = profit >= 0 ? "red" : "blue";
  addLog(`${type === 'long' ? '買' : '売'}決済: ${currentPrice}円${IS_MOBILE ? '' : ' (損益:' + profit + ')'}`, 'black');
  updateDisplay();
}

function closeAll() {
  if (positions.long.length === 0 && positions.short.length === 0) return;
  const currentPrice = dailyData[currentDailyIndex].close;
  let profit = 0;
  positions.long.forEach(p  => profit += (currentPrice - p.price) * p.qty);
  positions.short.forEach(p => profit += (p.price - currentPrice) * p.qty);
  totalProfit += profit;
  positions = { long: [], short: [] };
  recordTradeHistory();
  document.getElementById('last-profit').innerText = (IS_MOBILE ? "一括: " + profit.toLocaleString() + "円" : "一括決済: " + profit.toLocaleString() + " 円");
  document.getElementById('last-profit').style.color = profit >= 0 ? "red" : "blue";
  addLog(`全決済: ${currentPrice}円${IS_MOBILE ? '' : ' (損益:' + profit + ')'}`, 'black');
  updateDisplay();
}

function recordTradeHistory() {
  const date = dailyData[currentDailyIndex].date;
  const item = { date: date, sQty: positions.short.length * 100, lQty: positions.long.length * 100, high: dailyData[currentDailyIndex].high };
  const idx = tradeHistory.findIndex(h => h.date === date);
  if (idx > -1) tradeHistory[idx] = item; else tradeHistory.push(item);
}

function updateDisplay() {
  if (dailyData.length === 0) return;
  const curP = dailyData[currentDailyIndex].close;
  const lQty = positions.long.length  * 100;
  const sQty = positions.short.length * 100;
  const lAvg = lQty > 0 ? Math.round(positions.long.reduce((s, p)  => s + p.price * p.qty, 0) / lQty) : "-";
  const sAvg = sQty > 0 ? Math.round(positions.short.reduce((s, p) => s + p.price * p.qty, 0) / sQty) : "-";

  let unrealized = 0;
  positions.long.forEach(p  => unrealized += (curP - p.price) * p.qty);
  positions.short.forEach(p => unrealized += (p.price - curP) * p.qty);

  document.getElementById('long-qty').innerText  = lQty;
  document.getElementById('long-avg').innerText  = lAvg;
  document.getElementById('short-qty').innerText = sQty;
  document.getElementById('short-avg').innerText = sAvg;
  document.getElementById('total-profit').innerText = totalProfit.toLocaleString() + " 円";
  document.getElementById('total-profit').style.color = totalProfit >= 0 ? "red" : "blue";

  const unEl = document.getElementById('unrealized-profit');
  unEl.innerText = "含み: " + unrealized.toLocaleString() + " 円";
  unEl.style.color = unrealized >= 0 ? (unrealized === 0 ? "#666" : "red") : "blue";

  // ★ エントリー日数表示
  const entryIdx = getEntryDayIndex();
  const entryEl  = document.getElementById('entry-day-count');
  const entryBtn = document.getElementById('btn-entry-back');
  if (entryIdx < 0) {
    entryEl.textContent = '- 日目';
    entryEl.style.color = '#999';
    entryBtn.disabled = true;
    entryBtn.style.opacity = '0.4';
    entryBtn.style.cursor = 'not-allowed';
  } else {
    const count = currentDailyIndex - entryIdx + 1;
    if (count >= 1) {
      entryEl.textContent = count + ' 日目';
      entryEl.style.color = '#e91e8c';
    } else {
      entryEl.textContent = '(エントリー前)';
      entryEl.style.color = '#999';
    }
    entryBtn.disabled = false;
    entryBtn.style.opacity = '1';
    entryBtn.style.cursor = 'pointer';
  }

  drawChart();
}

function addLog(msg, color) {
  const log = document.getElementById('log-area');
  log.innerHTML = `<div style="color:${color}; margin-bottom:1px;">[${IS_MOBILE ? dailyData[currentDailyIndex].date.slice(5) : dailyData[currentDailyIndex].date}] ${msg}</div>` + log.innerHTML;
}

function drawChart() {
  if (dailyData.length === 0) return;

  const currentFullDaily = dailyData.slice(0, currentDailyIndex + 1);
  let tempWeekly  = aggregateDataFromList(currentFullDaily, 'weekly');
  let tempMonthly = aggregateDataFromList(currentFullDaily, 'monthly');
  calculateMA(tempWeekly);
  calculateMA(tempMonthly);

  let targetData = (timeframe === 'weekly') ? tempWeekly : (timeframe === 'monthly') ? tempMonthly : currentFullDaily;

  let targetDate = dailyData[currentDailyIndex].date;
  let displayIndex = targetData.findIndex(d => {
    if (timeframe === 'daily') return d.date === targetDate;
    return d.originalDates.includes(targetDate);
  });
  if (displayIndex === -1) displayIndex = targetData.length - 1;

  const startIdx = Math.max(0, displayIndex - FIXED_VIEW_RANGE + 1);
  let viewData = JSON.parse(JSON.stringify(targetData.slice(startIdx, displayIndex + 1)));

  if (timeframe !== 'daily' && viewData.length > 0) {
    let currentBar = viewData[viewData.length - 1];
    const startOfIdx = dailyData.findIndex(d => d.date === currentBar.originalDates[0]);
    const currentPeriodDaily = dailyData.slice(startOfIdx, currentDailyIndex + 1);
    currentBar.open  = currentPeriodDaily[0].open;
    currentBar.high  = Math.max(...currentPeriodDaily.map(d => d.high));
    currentBar.low   = Math.min(...currentPeriodDaily.map(d => d.low));
    currentBar.close = dailyData[currentDailyIndex].close;
  }
  const dates = viewData.map(d => d.date);

  const candle = {
    x: dates, open: viewData.map(d => d.open), high: viewData.map(d => d.high),
    low: viewData.map(d => d.low), close: viewData.map(d => d.close),
    type: 'candlestick', name: timeframe.toUpperCase(),
    increasing: { line: { color: '#ff5252' }, fillcolor: '#ff5252' },
    decreasing: { line: { color: '#26a69a' }, fillcolor: '#26a69a' }
  };

  const traces = [candle];
  const maConfigs = [
    {key: 'maShort', name: document.getElementById('ma-short-val').value + 'MA', color: '#000',    width: 1.5},
    {key: 'ma13',    name: (document.getElementById('ma-mid-val') ? document.getElementById('ma-mid-val').value : DEFAULT_MA_MID) + 'MA', color: '#9e9e9e', width: 1.5},
    {key: 'ma20',    name: '20MA',  color: '#f44336', width: DEVICE.maWidth.ma20},
    {key: 'ma60',    name: '60MA',  color: '#2196f3', width: DEVICE.maWidth.ma60},
    {key: 'ma100',   name: '100MA', color: '#9c27b0', width: DEVICE.maWidth.ma100},
    {key: 'ma300',   name: '300MA', color: '#f8bbd0', width: 1.5}
  ];
  maConfigs.forEach(m => {
    traces.push({
      x: dates, y: viewData.map(d => d[m.key]), name: m.name,
      line: {color: m.color, width: m.width}, type: 'scatter', mode: 'lines', hoverinfo: 'skip'
    });
  });

  // ★ 水平線
  const hlineShapes = hlines.map(h => ({
    type: 'line',
    xref: 'paper', yref: 'y',
    x0: 0, x1: 1,
    y0: h.y, y1: h.y,
    line: { color: HLINE_COLOR, width: 1.5, dash: 'solid' }
  }));

  const hlineAnnotations = hlines.map(h => ({
    xref: 'paper', yref: 'y',
    x: 1.01, y: h.y,
    text: h.y.toLocaleString(),
    showarrow: false,
    font: { size: DEVICE.hlineFont, color: HLINE_COLOR },
    xanchor: 'left'
  }));

  const layout = {
    hoverlabel: {
      bgcolor: 'rgba(255, 255, 255, 0.9)',
      bordercolor: '#ccc',
      font: { color: 'black', size: 12 }
    },
    autosize: IS_MOBILE ? true : undefined,
    xaxis: IS_MOBILE ? {
      type: 'category',
      fixedrange: true,
      tickmode: 'array',
      tickvals: dates.filter((_, i) => i % 12 === 0),
      ticktext: dates.filter((_, i) => i % 12 === 0).map(d => d.replace(/-/g, '/')),
      tickangle: 0,
      tickfont: { size: 9 },
      rangeslider: { visible: false }
    } : { type: 'category', fixedrange: true, tickangle: -60, tickfont: { size: 12, color: '#333' }, automargin: true, rangeslider: { visible: false } },
    yaxis: IS_MOBILE
      ? { side: 'right', fixedrange: true, gridcolor: '#eee', tickfont: { size: 10 } }
      : { side: 'right', gridcolor: '#eee', fixedrange: true, automargin: true },
    showlegend: true,
    legend: IS_MOBILE
      ? { orientation: 'h', x: 0, y: 1.15, font: {size: 10}, bgcolor: 'rgba(255,255,255,0.6)' }
      : { x: 0, y: 1, font: {size: 11}, bgcolor: 'rgba(255,255,255,0.7)' },
    margin: IS_MOBILE ? { t: 50, b: 30, l: 5, r: 45, pad: 0 } : { t: 30, b: 120, l: 10, r: 60 },
    plot_bgcolor: '#fff',
    shapes: hlineShapes,
    annotations: [...hlineAnnotations]
  };

  tradeHistory.forEach(h => {
    let isTarget = false;
    let displayX = h.date;
    if (timeframe === 'daily') {
      isTarget = dates.includes(h.date);
    } else {
      let foundBar = viewData.find(vd => vd.originalDates.includes(h.date));
      if (foundBar) { isTarget = true; displayX = foundBar.date; }
    }
    if (isTarget) {
      layout.annotations.push({
        x: displayX, y: h.high, xref: 'x', yref: 'y',
        text: `${h.sQty/100}-${h.lQty/100}`,
        showarrow: true, arrowhead: 2, arrowcolor: 'rgba(218,165,32,0.6)',
        ax: 0, ay: -50, yshift: 5,
        bgcolor: 'rgba(255,255,0,0.4)', bordercolor: 'rgba(255,215,0,0.8)',
        font: { size: 11, weight: 'bold' }
      });
    }
  });

  Plotly.newPlot('chart', traces, layout, {responsive: true, displayModeBar: false});
}

const SAVE_KEY_PREFIX = 'tradeToolSave_';

function getSaves() {
  let saves = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(SAVE_KEY_PREFIX)) {
      try { saves.push(JSON.parse(localStorage.getItem(key))); } catch(e) {}
    }
  }
  return saves.sort((a, b) => b.timestamp - a.timestamp);
}

function updateSaveList() {
  const list = document.getElementById('save-list');
  list.innerHTML = '';
  const saves = getSaves();
  if (saves.length === 0) {
    list.innerHTML = '<option value="">保存データなし</option>';
    return;
  }
  saves.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.text = s.memo || s.date || '無題';
    list.add(opt);
  });
}

// ★ 保存名を自動生成： エントリー日_コード銘柄名_損益累計額円_日数日  (例: 18-03-27_4452花王_-42300円_37日)
function buildAutoSaveName() {
  // 銘柄コード＋名称（お気に入りリストにあれば名称も付与、手入力の場合はコードのみ）
  const code = document.getElementById('ticker-input').value.trim();
  let name = "";
  const sel = document.getElementById('ticker-select');
  if (sel) {
    for (let i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === code) {
        name = sel.options[i].text.replace(/^\d+\s*/, '');
        break;
      }
    }
  }
  const stockLabel = code + name;

  // 短期MA・中期MA（例: 5MA_10MA）
  const maSEl = document.getElementById('ma-short-val');
  const maMEl = document.getElementById('ma-mid-val');
  const maLabel = (maSEl && maSEl.value ? maSEl.value : DEFAULT_MA_SHORT) + 'MA_' + (maMEl && maMEl.value ? maMEl.value : DEFAULT_MA_MID) + 'MA';

  // エントリー日 と 経過日数（右UIの「○日目」と同じロジック）
  const entryIdx = getEntryDayIndex();
  let entryDate = dailyData[currentDailyIndex].date;
  let dayCount = 0;
  if (entryIdx >= 0) {
    entryDate = dailyData[entryIdx].date;
    dayCount = currentDailyIndex - entryIdx + 1;
    if (dayCount < 0) dayCount = 0;
  }

  // 損益累計額（カンマなし）
  const profit = (typeof totalProfit !== 'undefined' ? totalProfit : 0);

  return `${entryDate}_${stockLabel}_${maLabel}_${profit}円_${dayCount}日`;
}

function quickSave(isOverwrite, btnElement) {
  if (!dailyData || dailyData.length === 0) {
    return alert("チャートデータが読み込まれていません。");
  }

  try {
    const memo = buildAutoSaveName();
    const targetDate = dailyData[currentDailyIndex].date;
    let saveId = SAVE_KEY_PREFIX + new Date().getTime();

    if (isOverwrite) {
      const list = document.getElementById('save-list');
      if (!list.value) return alert("上書きするデータが選択されていません。");
      saveId = list.value;
      const existingStr = localStorage.getItem(saveId);
      if (!existingStr) return alert("上書き対象のデータが見つかりません。");
    }

    const saveData = {
      id: saveId,
      timestamp: isOverwrite ? JSON.parse(localStorage.getItem(saveId)).timestamp : new Date().getTime(),
      date: targetDate,
      memo: memo,
      maShort: document.getElementById('ma-short-val') ? document.getElementById('ma-short-val').value : DEFAULT_MA_SHORT,
      maMid: document.getElementById('ma-mid-val') ? document.getElementById('ma-mid-val').value : DEFAULT_MA_MID,
      viewRange: typeof FIXED_VIEW_RANGE !== 'undefined' ? FIXED_VIEW_RANGE : DEVICE.viewRange,
      history: typeof tradeHistory !== 'undefined' ? tradeHistory : [],
      pos: typeof positions !== 'undefined' ? positions : { long: [], short: [] },
      profit: typeof totalProfit !== 'undefined' ? totalProfit : 0,
      lines: typeof hlines !== 'undefined' ? hlines : []
    };

    localStorage.setItem(saveId, JSON.stringify(saveData));

    updateSaveList();
    document.getElementById('save-list').value = saveId;

    if (btnElement) {
      const originalText = btnElement.innerText;
      btnElement.innerText = "保存完了！";
      setTimeout(() => btnElement.innerText = originalText, 1500);
    }

  } catch (e) {
    console.error("保存エラー:", e);
    alert("保存に失敗しました。\n\n【考えられる原因】\n・ブラウザがシークレットモードである\n・ローカルファイル(file://)での保存が制限されている\n\nエラー詳細: " + e.message);
  }
}

function quickLoad() {
  const saveId = document.getElementById('save-list').value;
  if (!saveId) return;

  const s = JSON.parse(localStorage.getItem(saveId));
  if (!s) return alert("データの読み込みに失敗しました。");

  let targetDate = s.date;
  if (s.history && s.history.length > 0) {
    let entryIdx = -1;
    const lastH = s.history[s.history.length - 1];
    const isClosedOnSave = (lastH.sQty === 0 && lastH.lQty === 0);

    for (let i = s.history.length - 1; i >= 0; i--) {
      const h = s.history[i];
      if (i === s.history.length - 1 && isClosedOnSave) continue;
      if (h.sQty === 0 && h.lQty === 0) break;
      entryIdx = i;
    }

    if (entryIdx !== -1) {
      targetDate = s.history[entryIdx].date;
    }
  }

  const idx = dailyData.findIndex(d => d.date === targetDate);
  if (idx === -1) {
    return alert(`現在のチャート上に開始日付（${targetDate}）が見つかりません。\nセーブ時と同じ銘柄・期間のCSVデータを読み込んでから実行してください。`);
  }

  currentDailyIndex = idx;
  document.getElementById('ma-short-val').value = s.maShort || DEFAULT_MA_SHORT;
  if (document.getElementById('ma-mid-val')) document.getElementById('ma-mid-val').value = s.maMid || DEFAULT_MA_MID;
  document.getElementById('view-range-val').value = s.viewRange || DEVICE.viewRange;
  FIXED_VIEW_RANGE = parseInt(s.viewRange || DEVICE.viewRange);

  tradeHistory = s.history || [];
  positions = s.pos || { long: [], short: [] };
  totalProfit = s.profit || 0;
  hlines = s.lines || [];

  updateAllMA();
  updateDisplay();
}

function deleteSave() {
  const saveId = document.getElementById('save-list').value;
  if (!saveId) return;

  const s = JSON.parse(localStorage.getItem(saveId));

  if (confirm(`以下のセーブデータを削除しますか？\n「${s.date} [${s.memo}]」`)) {
    localStorage.removeItem(saveId);
    updateSaveList();
  }
}

function deleteAllSaves() {
  if (!confirm('全セーブデータを削除しますか？')) return;
  Object.keys(localStorage).filter(k => k.startsWith(SAVE_KEY_PREFIX)).forEach(k => localStorage.removeItem(k));
  updateSaveList();
}

// ★ 起動時：記憶したMAを反映 → セーブ一覧を表示
loadMAPrefs();
updateSaveList();
</script>
